<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<style>
  :root { --ink: #2B2220; --mute: #8A7F78; --line: #EAE2D6; --accent: #D97757; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { padding: 6px 8px 10px; font: 13px/1.4 "Segoe UI", "Microsoft YaHei UI", "Yu Gothic UI", sans-serif; color: var(--ink); user-select: none; }
  .card { background: #FFFDF9; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px 12px;
          box-shadow: 0 4px 14px rgba(60, 40, 30, .18); margin-top: 8px; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .bang { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent);
          font-weight: 900; display: grid; place-items: center; font-size: 12px; flex: none; }
  .tool { font-weight: 700; }
  .proj { color: var(--mute); margin-left: auto; font-size: 12px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main { font: 12px/1.45 Consolas, "Cascadia Mono", monospace; background: #F6F0E6; border-radius: 8px; padding: 6px 8px;
          max-height: 78px; overflow: auto; word-break: break-all; white-space: pre-wrap; user-select: text; }
  .note { color: var(--mute); font-size: 12px; margin-top: 4px; }
  .btns { display: flex; gap: 6px; margin-top: 10px; }
  button { font: inherit; border-radius: 8px; padding: 5px 12px; cursor: pointer; border: 1.5px solid var(--line); background: #fff; color: var(--ink); }
  button.allow { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.always { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.deny { margin-left: auto; }
  button:hover { filter: brightness(.96); }
  button:disabled { opacity: .45; cursor: default; filter: none; }
  .fname { font-weight: 700; font-size: 14px; word-break: break-all; }
  .path { margin: 0 0 6px; word-break: break-all; }
  .diff .del { color: #B3261E; background: #FBE7E4; border-radius: 3px; }
  .diff .add { color: #2E6B30; background: #E6F3E3; border-radius: 3px; }
  .main b { color: var(--mute); font-weight: 600; }
  .q + .q { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .qhead { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 8px; margin-bottom: 4px; }
  .qtext { font-weight: 600; margin-bottom: 6px; }
  .opt { border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 10px; margin-top: 5px; cursor: pointer; background: #fff; }
  .opt:hover { border-color: var(--accent); }
  .opt.on { border-color: var(--accent); background: #FDF1EB; }
  .olabel { font-weight: 600; }
  .odesc { color: var(--mute); font-size: 12px; }
  input.other { width: 100%; font: inherit; margin-top: 5px; padding: 6px 10px; border: 1.5px dashed var(--line); border-radius: 10px; background: #fff; color: var(--ink); outline: none; user-select: text; }
  input.other:focus { border-style: solid; border-color: var(--accent); }
</style>
</head>
<body>
  <div id="list"></div>
  <script src="approvals-ui.js"></script>
</body>
</html>
