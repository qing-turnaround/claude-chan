<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Claude-chan</title>
<style>
  :root { --bg: #FAF6EF; --card: #FFFFFF; --ink: #2B2220; --mute: #8A7F78; --line: #EFE7DB; --accent: #D97757; --tint: #FDF1EB; }
  * { box-sizing: border-box; }
  html { overflow: hidden; }
  body { margin: 0; padding: 18px 20px 20px; background: var(--bg); color: var(--ink);
         font: 14px/1.45 "Segoe UI", "Microsoft YaHei UI", "Yu Gothic UI", sans-serif; user-select: none; }

  .app { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .app img { width: 44px; height: 44px; }
  .app .name { font-size: 17px; font-weight: 700; }
  .app .ver { font-size: 12px; color: var(--mute); }

  h2 { font-size: 12px; color: var(--mute); margin: 18px 4px 6px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 2px 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); min-height: 52px; }
  .row:first-child { border-top: 0; }
  .label .hint { color: var(--mute); font-size: 12px; margin-top: 1px; }

  /* outfits */
  .outfits { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 14px 0 12px; }
  .outfit { position: relative; border: 2px solid transparent; border-radius: 12px; background: #FBF7F1; padding: 6px 2px 5px;
            text-align: center; cursor: pointer; font-size: 12px; color: var(--mute); transition: background .12s, border-color .12s; }
  .outfit:hover { background: #F6EEE3; }
  .outfit img, .outfit svg { width: 100%; height: 66px; object-fit: contain; display: block; margin-bottom: 3px; }
  .outfit.on { border-color: var(--accent); background: var(--tint); color: var(--ink); font-weight: 600; }
  .outfit.on::after { content: "✓"; position: absolute; top: 4px; right: 6px; width: 16px; height: 16px; border-radius: 50%;
                      background: var(--accent); color: #fff; font-size: 10px; line-height: 16px; font-weight: 700; }

  /* which Clawds */
  .chips { display: flex; gap: 8px; }
  .chip { display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 6px;
          cursor: pointer; background: #fff; color: var(--mute); }
  .chip svg { width: 22px; height: 16px; }
  .chip.on { border-color: var(--accent); background: var(--tint); color: var(--ink); }

  /* size slider */
  .size { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 250px; }
  .size output { width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: var(--mute); font-size: 13px; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 6px; border-radius: 999px; outline: none; cursor: pointer;
                      background: linear-gradient(to right, var(--accent) var(--p, 50%), #EADFD2 var(--p, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff;
                      border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(60, 40, 30, .25); }
  .reset { border: 0; background: none; color: var(--mute); cursor: pointer; font-size: 15px; padding: 0 2px; line-height: 1; }
  .reset:hover { color: var(--accent); }

  select { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }

  /* switch */
  .sw { position: relative; width: 40px; height: 22px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; border-radius: 999px; background: #DDD3C6; cursor: pointer; }
  .sw span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .ready .sw span, .ready .sw span::after { transition: .15s; }
  .sw input:checked + span { background: var(--accent); }
  .sw input:checked + span::after { transform: translateX(18px); }
</style>
</head>
<body>
  <div class="app"><img src="assets/icon.png"><div><div class="name">Claude-chan</div><div class="ver" id="ver"></div></div></div>

  <h2 id="secLook"></h2>
  <div class="card">
    <div class="outfits" id="outfits"></div>
    <div class="row" id="clawdRow"><div class="label" id="who"></div><div class="chips" id="chips"></div></div>
    <div class="row">
      <div class="label" id="sizeLabel"></div>
      <div class="size"><input type="range" id="size" step="0.05"><output id="sizeOut"></output><button class="reset" id="reset">↺</button></div>
    </div>
  </div>

  <h2 id="secMove"></h2>
  <div class="card">
    <div class="row"><div class="label"><div id="roamLabel"></div><div class="hint" id="roamHint"></div></div>
      <label class="sw"><input type="checkbox" id="roam"><span></span></label></div>
    <div class="row"><div class="label"><div id="linkLabel"></div><div class="hint" id="linkHint"></div></div>
      <label class="sw"><input type="checkbox" id="link"><span></span></label></div>
  </div>

  <h2 id="secGeneral"></h2>
  <div class="card">
    <div class="row"><div class="label" id="loginLabel"></div><label class="sw"><input type="checkbox" id="login"><span></span></label></div>
    <div class="row"><div class="label" id="langLabel"></div><select id="lang"></select></div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
